<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bai3</title>
</head>
<body>

	<h1>THÔNG TIN</h1>

	<form name="frm" action="" method="post">
	<div>
    	<label for="txtName">Name</label>
    	<input type="text" id="txtName" name="txtName" placeholder="Nhập tên...">
	</div>

	<div>
    	<label>Giới tính</label>
    	<div>
        	<input type="radio" name="gioiTinh" id="gtNam" value="Nam" checked>
        	<label for="gtNam">Nam</label>

        	<input type="radio" name="gioiTinh" id="gtNu" value="Nữ">
        	<label for="gtNu">Nữ</label>

        	<input type="radio" name="gioiTinh" id="gtKhac" value="Khác">
        	<label for="gtKhac">Khác</label>
    	</div>
	</div>

	<div>
    	<label>Sở thích</label>
    	<div>
        	<input type="checkbox" name="SoThich" id="bongDa" value="Bóng đá" checked>
        	<label for="bongDa">Bóng đá</label>

        	<input type="checkbox" name="SoThich" id="boiLoi" value="Bơi lội">
        	<label for="boiLoi">Bơi lội</label>

        	<input type="checkbox" name="SoThich" id="bongChuyen" value="Bóng chuyền">
        	<label for="bongChuyen">Bóng chuyền</label>
    	</div>
	</div>
	
	<div class="nut">
		<button onclick="return getData(); ">Lấy thông tin</button>
		<button>Thay đổi tên</button>
	</div>
	</form>
	
	<div id="kq"></div>
	
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		h1{
			text-align: center;
		}
		form #kq{
			margin: 1rem auto;
			padding: 1rem;
			width: 500px;
			border: 1px #7ACAF2;
			border-radius: 10px;
		}
		#kq{
			display: none;
		}
		form>div{
			margin: 1rem 0;
			display: flex;
			align_items: center;
		}
		form>div>label{
			display: inline-block;
			width: 80px;
			font-weight: bold;
		}
		
		input[type="text"]{
			border: 1px #007483;
			border-radius: 5px;
			paddinf: .5rem;
			width: calc(100% - 100px);
		}
		nut{
			display: flex;
			justify-content: center;
			gap: 1rem;
		}
		button{
			border-radius: 5px;
			border: 1px #038C95;
			padding: .5rem 1rem;
		}
	</style>

	<script>
		function getData() {
    debugger;

    let name = document.getElementById("txtName").value;

    let gt = document.getElementsByName("gioiTinh");
    let gioiTinh = "";

    for (let i = 0; i < gt.length; i++) {
        if (gt[i].checked) {
            gioiTinh = gt[i].value;
        }
    }

    let st = document.getElementsByName("chkSoThich");
    let soThich = [];

    for (let i = 0; i < st.length; i++) {
        if (st[i].checked) {
            soThich.push(st[i].value);
        }
    }

    console.log("Tên:", name);
	console.log("Giới tính:", gioiTinh);
	let sth = soThich.join(", ");
	console.log("Sở thích:", sth);

		let strInfo = `<h2> Xin chào, ${name} </h2>`;
			strInfo += `<p> Giới tính: ${gioiTinh} </p>`;
			strInfo += `<p> Sở thích: ${sth} </p>`;

		document.getElementById("ketQua").innerHTML = strInfo;
		document.getElementById("ketQua").style.display = "block";
		return false;
		}

	const changeName = () => {
    	document.getElementById("txtName").value = "Devmaster Academy!";
    	return false;
	}
	</script>
</body>
</html>
