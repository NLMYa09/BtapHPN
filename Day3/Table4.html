<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Table4</title>
</head>
<body>

<h2 align="center">FORM ĐĂNG NHẬP</h2>

<form>
<table border="1" align="center" cellpadding="8">

    <tr>
        <td>Tên đăng nhập</td>
        <td><input type="text" placeholder="Nhập username"></td>
    </tr>

    <tr>
        <td>Mật khẩu</td>
        <td><input type="password" placeholder="Nhập password"></td>
    </tr>

    <tr>
        <td>Ghi nhớ</td>
        <td>
            <input type="checkbox"> Ghi nhớ đăng nhập
        </td>
    </tr>

    <tr align="center">
        <td colspan="2">
            <input type="submit" value="Đăng nhập">
            <input type="reset" value="Nhập lại">
        </td>
    </tr>

    <tr align="center">
        <td colspan="2">
            <a href="#">Quên mật khẩu?</a> |
            <a href="#">Đăng ký</a>
        </td>
    </tr>

</table>
</form>

</body>
</html>
